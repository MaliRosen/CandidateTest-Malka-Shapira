<form [formGroup]="form" class="search-filter">
  <div class="filter-row">

    <!-- Request Number -->
    <div class="filter-field">
      <label for="requestNumber">Request Number</label>
      <input
        id="requestNumber"
        type="text"
        formControlName="requestNumber"
        placeholder="Search by request number…"
      />
    </div>

    <!-- Status multi-select -->
    <div class="filter-field">
      <label for="status">Status</label>
      <select
        id="status"
        formControlName="status"
        multiple
        size="4"
        aria-label="Filter by status"
      >
        <option
          *ngFor="let opt of statusOptions"
          [value]="opt.value"
        >{{ opt.label }}</option>
      </select>
    </div>

    <!-- Request Type multi-select -->
    <div class="filter-field">
      <label for="requestType">Request Type</label>
      <select
        id="requestType"
        formControlName="requestType"
        multiple
        size="4"
        aria-label="Filter by request type"
      >
        <option
          *ngFor="let opt of requestTypeOptions"
          [value]="opt.value"
        >{{ opt.label }}</option>
      </select>
    </div>

    <!-- Created From date -->
    <div class="filter-field">
      <label for="createdFrom">Created From</label>
      <input
        id="createdFrom"
        type="date"
        formControlName="createdFrom"
      />
    </div>

    <!-- Created To date -->
    <div class="filter-field">
      <label for="createdTo">Created To</label>
      <input
        id="createdTo"
        type="date"
        formControlName="createdTo"
      />
    </div>

  </div>
</form>
