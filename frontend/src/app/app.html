<div class="app-container">
  <h1 class="app-title">ניהול בקשות</h1>

  <!-- Search & Filter -->
  <app-search-filter
    (filterChange)="onFilterChange($event)">
  </app-search-filter>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="loading-indicator" aria-live="polite" aria-busy="true">
    <span class="spinner" aria-hidden="true"></span>
    <span>טוען נתונים...</span>
  </div>

  <!-- Error message -->
  <div *ngIf="error && !loading" class="error-message" role="alert">
    <span>{{ error }}</span>
  </div>

  <!-- Results table -->
  <app-requests-table
    *ngIf="!loading"
    [items]="result?.items ?? []"
    [sortBy]="query.sortBy"
    [sortDirection]="query.sortDirection"
    (sortChange)="onSortChange($event)">
  </app-requests-table>

  <!-- Pagination -->
  <app-pagination
    *ngIf="!loading && result"
    [page]="result.page"
    [pageSize]="result.pageSize"
    [totalCount]="result.totalCount"
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
